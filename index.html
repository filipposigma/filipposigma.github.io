<script>
(function(){
  var box=document.querySelector(".slider"); if(!box) return;
  var slides=[].slice.call(box.querySelectorAll(".slide")), cap=box.querySelector(".slide-cap"), i=0, t=null, paused=false;
  if(slides.length<2) return;
  function show(n){
    slides[i].classList.remove("is-on"); i=n%slides.length; slides[i].classList.add("is-on");
    cap.classList.add("swap");
    setTimeout(function(){ cap.textContent=slides[i].getAttribute("data-name"); cap.classList.remove("swap"); },250);
  }
  function start(){ if(t||matchMedia("(prefers-reduced-motion: reduce)").matches) return; t=setInterval(function(){ if(!paused&&!document.hidden) show(i+1); },4500); }
  box.addEventListener("mouseenter",function(){paused=true;}); box.addEventListener("mouseleave",function(){paused=false;});
  box.addEventListener("focusin",function(){paused=true;}); box.addEventListener("focusout",function(){paused=false;});
  start();
})();
</script>
<script>
(function(){
  var h=document.querySelector(".site-head"); if(!h) return;
  var hero=document.querySelector(".cs-hero"), last=window.scrollY, busy=false;
  function update(){
    var y=window.scrollY;
    if(y<=8){ h.classList.remove("hide"); last=y; }
    else if(Math.abs(y-last)>=6){
      h.classList.toggle("hide", y>last);
      last=y;
    }
    if(hero){ var bd=document.querySelector(".cs-body"); h.classList.toggle("over", bd.getBoundingClientRect().top > h.offsetHeight); }
    busy=false;
  }
  window.addEventListener("scroll",function(){ if(!busy){ busy=true; requestAnimationFrame(update); } },{passive:true});
  window.addEventListener("resize",update); update();
})();
</script>
