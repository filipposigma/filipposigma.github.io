<script>
(function(){
  var h=document.querySelector(".site-head"); if(!h) return;
  var hero=document.querySelector(".cs-hero"), last=window.scrollY, busy=false;
  function update(){
    var y=window.scrollY;
    if(y<=8){ h.classList.remove("hide"); last=y; }
    else if(Math.abs(y-last)>=6){
      h.classList.toggle("hide", y>last);
      last=y;
    }
    if(hero){ var bd=document.querySelector(".cs-body"); h.classList.toggle("over", bd.getBoundingClientRect().top > h.offsetHeight); }
    busy=false;
  }
  window.addEventListener("scroll",function(){ if(!busy){ busy=true; requestAnimationFrame(update); } },{passive:true});
  window.addEventListener("resize",update); update();
})();
</script>
